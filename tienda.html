<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Catálogo - CRJ Muebles</title>
  <meta name="theme-color" content="#F29E5C">

  <!-- Bootstrap (solo CSS) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome para iconos (por si quieres usarlos aquí también) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/icon-192.png">
</head>

<body class="app-body">

  <!-- HEADER CON LOGO + TÍTULO CATÁLOGO -->
  <header class="topbar topbar-logo-full">
    <div class="header-hero-row">
      <div class="logo-wrapper">
        <img src="img/logo-crj.png" alt="CRJ Muebles" class="logo-big">
      </div>

      <div class="header-text">
        <h1 class="header-title">Catálogo CRJ Muebles</h1>
        <p class="header-subtitle">
          Explora muebles Montessori, piezas para grill y muebles a la medida.
        </p>
      </div>
    </div>
  </header>

  <main class="main-content">
    <!-- FILTROS / BUSCADOR -->
    <section class="home-section">
      <div class="section-header">
        <h2>Todos los modelos</h2>
      </div>

      <div class="catalog-filters">
        <div class="catalog-filters-row">
          <div class="catalog-search-wrap">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input
              id="search-input"
              type="search"
              placeholder="Buscar por nombre o descripción..."
              class="catalog-search"
            >
          </div>
      
          <button type="button" class="catalog-clear" id="clear-filters">
            Limpiar
          </button>
        </div>
      
        <div class="business-filters">
          <button type="button" class="filter-pill filter-pill-active" data-linea="all">
            Todo
          </button>
          <button type="button" class="filter-pill" data-linea="montessori">
            Montessori
          </button>
          <button type="button" class="filter-pill" data-linea="grill">
            Grill / Cocina
          </button>
          <button type="button" class="filter-pill" data-linea="medida">
            A la medida
          </button>
        </div>
      
        <p id="catalog-summary" class="catalog-summary"></p>
      </div>
      
      <div class="grid cards-grid" id="lista-productos"></div>
      

      <div class="grid cards-grid" id="lista-productos"></div>
    </section>

    <!-- REDES (PIE SUAVE) -->
    <section class="home-section social-section">
      <h3>¿No encuentras lo que buscas?</h3>
      <p>Escríbenos y platicamos de lo que tienes en mente.</p>

      <div class="social-links">
        <a href="https://wa.me/525537027887" target="_blank" class="social-pill social-wa">
          <i class="fa-brands fa-whatsapp"></i>
          <span>WhatsApp 55 3702 7887</span>
        </a>
      </div>
    </section>
  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span>Inicio</span></a>
    <a href="tienda.html" class="nav-item nav-item-active"><span>Tienda</span></a>
    <a href="https://wa.me/525537027887?text=Hola,%20quiero%20informaci%C3%B3n%20de%20muebles"
       class="nav-item"><span>WhatsApp</span></a>
  </nav>

  <script src="app.js"></script>
</body>

</html>
